apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: breakglass
        image: harbor.local/library/breakglass-2:v1
        imagePullPolicy: IfNotPresent
        args:
            - --config-path=/config/config.yaml
            - --pod-namespace=$(POD_NAMESPACE)
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
            # - --leader-elect-namespace=$(POD_NAMESPACE)
            - --leader-elect-id=breakglass.telekom.io
            - --cluster-config-check-interval=10m
            - --escalation-status-update-interval=10m
            # Component enable flags for multi-instance deployments (all default to true)
            - --enable-frontend=true
            - --enable-api=true
            - --enable-cleanup=true
            - --enable-webhooks=true
            - --enable-validating-webhooks=true
            # Webhook metrics server (optional separate endpoint)
            - --webhooks-metrics-bind-address=:8083
            - --webhooks-metrics-secure=false
            - --debug
            - --webhook-cert-generation=true
            - --webhook-service-name=breakglass-dev-breakglass-webhook-service
            - --webhook-validating-config-name=breakglass-dev-breakglass-validating-webhook-configuration
            - --breakglass-namespace=$(POD_NAMESPACE)
        resources: {}
